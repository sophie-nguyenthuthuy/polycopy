name: collect
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The DB must survive between runs, or every cycle re-discovers from
      # scratch and all accumulated fills are lost. Committing the binary would
      # bloat the repo (~20MB churning 48x/day), so it rides the cache and the
      # analysis rows are committed as CSV instead. Unique key => always saved;
      # restore-keys pulls the most recent previous cache.
      - name: restore db
        uses: actions/cache@v4
        with:
          path: data/polycopy.db
          key: polycopy-db-${{ github.run_id }}
          restore-keys: polycopy-db-
      - name: tests
        run: python3 -m unittest discover -s tests
      - name: collection cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./ci_cycle.sh
      - name: commit data
        run: |
          git config user.name "polycopy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: cycle $(date -u +%Y-%m-%d-%H%M) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

